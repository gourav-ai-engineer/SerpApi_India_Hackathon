[theme]
base = "dark"
primaryColor = "#7c9cff"
backgroundColor = "#070b16"
secondaryBackgroundColor = "#131b30"
textColor = "#eef2ff"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
# Hide the developer toolbar ("Deploy" button) so toasts don't overlap it.
toolbarMode = "viewer"
